[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forecast-zarr-processor"
version = "0.3.1"
description = "Convert weather, wind-energy, and solar-energy forecast GRIB2 runs to validated Zarr v3 stores"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Vyacheslav Semenov", email = "mantesum@projecteol.ru" }]
keywords = ["weather", "grib", "zarr", "eccodes", "forecast", "wind-energy", "solar-energy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "eccodes>=2.42",
  "eccodeslib>=2.42; sys_platform != 'win32'",
  "numpy>=2.2",
  "pydantic>=2.10",
  "pyyaml>=6.0.2",
  "structlog>=25.1",
  "typer>=0.15",
  "zarr>=3.2",
]

[project.optional-dependencies]
xarray = ["xarray>=2025.1"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
forecast-zarr = "forecast_zarr.cli:app"

[project.urls]
Repository = "https://github.com/Mantesum/forecast-zarr-processor"
Issues = "https://github.com/Mantesum/forecast-zarr-processor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_zarr"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["forecast_zarr"]

[[tool.mypy.overrides]]
module = ["eccodes"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

processor:
  input_run: ../data/raw/noaa-gfs/gfs/20250101T000000Z/replace-with-request-hash
  output_root: ../data/benchmark
  encoding: api_compact
  variables:
    - air_temperature_2m
    - eastward_wind_10m
    - northward_wind_10m
  runtime:
    memory_budget_gib: 8
    max_workers: 2
  storage:
    total_budget_gib: 40
    min_free_gib: 10
    max_zarr_output_gib: 26
    max_temporary_gib: 6
strategies:
  - name: balanced-8mib
    chunking:
      target_shard_mib: 8
      time_chunk: 1
      time_shard: 6
      min_spatial_chunk: 90
      max_spatial_chunk: 360
      max_spatial_shard: 720
  - name: point-oriented-4mib
    chunking:
      target_shard_mib: 4
      time_chunk: 3
      time_shard: 12
      min_spatial_chunk: 64
      max_spatial_chunk: 180
      max_spatial_shard: 512
  - name: map-oriented-16mib
    chunking:
      target_shard_mib: 16
      time_chunk: 1
      time_shard: 4
      min_spatial_chunk: 180
      max_spatial_chunk: 360
      max_spatial_shard: 720

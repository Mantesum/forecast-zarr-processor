# Process one complete output directory produced by forecast-ingest.
input_run: ../data/raw/noaa-gfs/gfs/20250101T000000Z/replace-with-request-hash
output_root: ../data/zarr
encoding: api_compact
longitude_convention: "-180_180"
crop_to_manifest_regions: true
resume: true
compression_level: 7
variables:
  - air_temperature_2m
  - relative_humidity_2m
  - dew_point_temperature_2m
  - air_pressure_at_mean_sea_level
  - surface_air_pressure
  - eastward_wind_10m
  - northward_wind_10m
  - precipitation_amount
  - precipitation_flux
  - cloud_area_fraction
  - visibility_in_air
  - surface_downwelling_shortwave_flux_in_air
  - surface_altitude
required_variables:
  - air_temperature_2m
  - eastward_wind_10m
  - northward_wind_10m
runtime:
  memory_budget_gib: 8
  max_workers: 2
storage:
  total_budget_gib: 40
  min_free_gib: 10
  max_zarr_output_gib: 26
  max_temporary_gib: 6
chunking:
  target_shard_mib: 8
  time_chunk: 1
  time_shard: 6
  min_spatial_chunk: 90
  max_spatial_chunk: 360
  max_spatial_shard: 720
validation:
  random_seed: 20250308
  point_samples: 24
  bbox_samples: 4

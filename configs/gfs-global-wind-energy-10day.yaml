input_run: ../data/raw/noaa-gfs/gfs/replace-with-run/replace-with-request-hash
output_root: ../data/zarr
encoding: api_compact
longitude_convention: "-180_180"
crop_to_manifest_regions: true
resume: true
compression_level: 7
variables:
  - eastward_wind_10m
  - northward_wind_10m
  - eastward_wind_80m
  - northward_wind_80m
  - eastward_wind_100m
  - northward_wind_100m
  - air_temperature_2m
  - air_temperature_80m
  - air_temperature_100m
  - specific_humidity_80m
  - air_pressure_80m
  - surface_air_pressure
  - air_pressure_at_mean_sea_level
  - wind_speed_of_gust
  - atmosphere_boundary_layer_thickness
  - friction_velocity
  - surface_roughness_length
  - precipitation_amount
  - surface_altitude
required_variables:
  - eastward_wind_80m
  - northward_wind_80m
  - eastward_wind_100m
  - northward_wind_100m
  - air_temperature_80m
  - specific_humidity_80m
  - air_pressure_80m
runtime:
  memory_budget_gib: 8
  max_workers: 2
storage:
  total_budget_gib: 40
  min_free_gib: 10
  max_zarr_output_gib: 26
  max_temporary_gib: 6
chunking:
  target_shard_mib: 8
  time_chunk: 1
  time_shard: 6
  min_spatial_chunk: 90
  max_spatial_chunk: 360
  max_spatial_shard: 720
validation:
  random_seed: 20250308
  point_samples: 24
  bbox_samples: 4
